<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR 3D Viewer</title>
    <!-- Import Google model-viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        model-viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Ganti 'model.glb' dengan nama file 3D Anda -->
    src="model.glb" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    camera-controls 
    auto-rotate>
        <button slot="ar-button" style="background: white; border-radius: 4px; border: none; position: absolute; bottom: 16px; left: 16px; padding: 12px 24px; font-weight: bold;">
            Tampilkan di Ruangan (AR)
        </button>
    </model-viewer>

</body>
</html>
